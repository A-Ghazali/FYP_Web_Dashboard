<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Arahan KTMB - Portal S-ICCT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            background-color: #f1f5f9;
        }

        /* Clean Light Mode Gov/Corporate Card */
        .login-card {
            background: #ffffff;
            color: #0f172a;
            padding: 40px 36px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
            border: 1px solid #cbd5e1;
            border-top: 5px solid #002B66;
            text-align: center;
            z-index: 10;
            position: relative;
        }

        /* Status Header Strip */
        .status-strip {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 0.8px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .status-online {
            color: #16a34a;
        }

        /* Logo Container */
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 14px 20px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .ktm-logo {
            width: 160px;
            height: auto;
            display: block;
        }

        .brand-badge {
            background: #002B66;
            color: #FFC72C;
            font-weight: 700;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            padding: 4px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .login-card h2 {
            margin: 0 0 4px 0;
            font-size: 1.25rem;
            color: #0f172a;
            font-weight: 800;
        }

        .subtitle {
            font-size: 0.78rem;
            color: #64748b;
            margin-bottom: 24px;
            font-weight: 500;
        }

        /* Form Inputs */
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            color: #334155;
            margin-bottom: 6px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 11px 14px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            color: #0f172a;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #002B66;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 43, 102, 0.1);
        }

        /* Action Button */
        button {
            width: 100%;
            padding: 12px;
            background: #002B66;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 4px;
        }

        button:hover {
            background: #001a40;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        /* Footer Info */
        .live-hud-footer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 0.72rem;
            color: #64748b;
            font-family: monospace;
            font-weight: 600;
        }

        .card-footer {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.7rem;
            color: #64748b;
        }

        #error-msg {
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.78rem;
            text-align: center;
            margin-top: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Malaysia Time Live Clock -->
    <div class="live-hud-footer">
        MYT: <span id="clock-display">--:--:--</span>
    </div>

    <!-- Official Login Card -->
    <div class="login-card">
        <div class="status-strip">
            <span>IPOH, PERAK</span>
            <span class="status-online">● SISTEM DALAM TALIAN</span>
        </div>

        <div class="logo-container">
            <img src="logo/Keretapi_Tanah_Melayu_Berhad_Logo.svg.png" alt="Logo KTMB" class="ktm-logo">
        </div>
        
        <div>
            <span class="brand-badge">Portal Rasmi</span>
            <h2>Sistem Pemantauan S-ICCT</h2>
            <div class="subtitle">Projek FYP DITN5B &bull; Kolaborasi KTMB</div>
        </div>
        
        <form id="login-form">
            <div class="input-group">
                <label for="email">E-mel</label>
                <input type="email" id="email" required placeholder="operator@ktmb.com.my" autocomplete="username">
            </div>
            
            <div class="input-group">
                <label for="password">Kata Laluan</label>
                <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
            </div>

            <button type="submit" id="btn-login">Log Masuk</button>
            <div id="error-msg">E-mel atau kata laluan tidak sah.</div>
        </form>

        <div class="card-footer">
            Keretapi Tanah Melayu Berhad &copy; 2026 Pemantauan Landasan
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        // Malaysia Time (MYT) Clock
        function updateMalaysiaClock() {
            const now = new Date();
            const options = {
                timeZone: 'Asia/Kuala_Lumpur',
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            document.getElementById('clock-display').innerText = now.toLocaleTimeString('en-GB', options);
        }
        setInterval(updateMalaysiaClock, 1000);
        updateMalaysiaClock();

        // Firebase Authentication Logic
        const firebaseConfig = {
            apiKey: "AIzaSyCTHW_s2SYe3KbDvDPWuyg5vHEbLv-MUnA",
            databaseURL: "https://fyp-sicct-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "fyp-sicct",
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        auth.onAuthStateChanged((user) => {
            if (user) {
                const currentPath = window.location.pathname;
                const targetPath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1) + 'index.html';
                window.location.replace(targetPath);
            }
        });

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const loginBtn = document.getElementById('btn-login');

            errorMsg.style.display = "none";
            loginBtn.innerText = "Mengesahkan...";
            loginBtn.disabled = true;

            auth.signInWithEmailAndPassword(email, password)
                .catch((error) => {
                    loginBtn.innerText = "Log Masuk";
                    loginBtn.disabled = false;
                    errorMsg.innerText = "E-mel atau kata laluan tidak sah.";
                    errorMsg.style.display = "block";
                });
        });
    </script>
</body>
</html>
